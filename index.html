<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B12" />
    <meta name="color-scheme" content="dark" />
    <title>aaam.dev — small, private apps</title>
    <meta name="description" content="aaam.dev is a small studio making two apps: hum, a calm space for couples, and tir, a word race for the room." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="aaam.dev" />
    <meta property="og:title" content="aaam.dev — small, private apps" />
    <meta property="og:description" content="two apps. one studio. hum, for two. tir, for the room." />
    <meta property="og:url" content="https://aaam.dev/" />
    <meta property="og:image" content="https://aaam.dev/hum/images/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="aaam.dev — small, private apps" />
    <meta name="twitter:description" content="two apps. one studio." />
    <meta name="twitter:image" content="https://aaam.dev/hum/images/og-cover.png" />

    <link rel="canonical" href="https://aaam.dev/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/hum/images/favicon-32.png" />
    <link rel="apple-touch-icon" href="/hum/images/icon-180.png" />

    <!-- Structured data: studio Organization + WebSite + the two apps as an
         ItemList. Entities are linked by @id so search + AI engines resolve
         "aaam.dev makes hum and tir" as one knowledge graph. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://aaam.dev/#org",
          "name": "aaam.dev",
          "url": "https://aaam.dev/",
          "email": "support@aaam.dev",
          "description": "A small independent studio making quiet, private, ad-free apps.",
          "foundingDate": "2026-05",
          "logo": "https://aaam.dev/hum/images/icon-1024.png"
        },
        {
          "@type": "WebSite",
          "@id": "https://aaam.dev/#website",
          "url": "https://aaam.dev/",
          "name": "aaam.dev",
          "description": "Two apps, one studio. hum, a calm space for couples. tir, a word race for the room.",
          "publisher": { "@id": "https://aaam.dev/#org" },
          "inLanguage": "en"
        },
        {
          "@type": "ItemList",
          "@id": "https://aaam.dev/#apps",
          "name": "Apps by aaam.dev",
          "itemListOrder": "https://schema.org/ItemListUnordered",
          "numberOfItems": 2,
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "item": {
                "@type": ["VideoGame", "MobileApplication"],
                "name": "tir",
                "alternateName": "tir · word race",
                "url": "https://aaam.dev/tir/",
                "applicationCategory": "GameApplication",
                "operatingSystem": "iOS, Android",
                "publisher": { "@id": "https://aaam.dev/#org" },
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
              }
            },
            {
              "@type": "ListItem",
              "position": 2,
              "item": {
                "@type": "MobileApplication",
                "name": "hum",
                "alternateName": "hum · for two",
                "url": "https://aaam.dev/hum/",
                "applicationCategory": "LifestyleApplication",
                "operatingSystem": "iOS, Android",
                "publisher": { "@id": "https://aaam.dev/#org" },
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
              }
            }
          ]
        }
      ]
    }
    </script>

    <style>
      :root {
        --bg: #0b0b12;
        --surface: #13131c;
        --card: #16151f;
        --card-hover: #1a1924;
        --border: #2a2535;
        --border-soft: rgba(42, 37, 53, 0.55);

        --text: #faf7f4;
        --muted: #b0aab8;
        --dim: #7a7490;

        --hum: #ff8e9b;
        --hum-warm: #ffb392;
        --tir: #00e5ff;

        --radius-sm: 12px;
        --radius-md: 18px;
        --radius-lg: 24px;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html {
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI',
          Roboto, 'Helvetica Neue', system-ui, sans-serif;
        font-feature-settings: 'ss01', 'cv11', 'tnum';
        font-weight: 300;
        line-height: 1.55;
        letter-spacing: -0.005em;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Ambient two-color halo: warm pink (hum) upper-left, cyan (tir) upper-right.
         Static gradient — no animation. Telegraphs "this studio makes both these apps." */
      .halo {
        position: fixed;
        inset: -20% -20% auto -20%;
        height: 95vh;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(45% 55% at 25% 0%, rgba(255, 142, 155, 0.22) 0%, transparent 65%),
          radial-gradient(45% 55% at 75% 0%, rgba(0, 229, 255, 0.16)  0%, transparent 65%);
        filter: blur(18px);
      }

      main {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(2rem, 5vw, 3rem);
        padding: clamp(2.5rem, 8vw, 5rem) clamp(1.25rem, 5vw, 2rem);
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
        text-align: center;
      }

      .brand-wordmark {
        font-size: clamp(2.2rem, 1.8rem + 2vw, 2.8rem);
        font-weight: 200;
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--text);
        text-wrap: balance;
      }

      .brand-wordmark .dot {
        color: var(--dim);
        font-weight: 200;
      }

      .tagline {
        margin-top: 0.7rem;
        font-size: clamp(0.95rem, 0.9rem + 0.3vw, 1.05rem);
        font-weight: 300;
        color: var(--muted);
        line-height: 1.45;
        max-width: 28ch;
        margin-inline: auto;
        text-wrap: balance;
      }

      .tagline em {
        font-style: normal;
        color: var(--text);
      }

      .apps {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        width: 100%;
      }

      .app-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.1rem 1.2rem;
        min-height: 76px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        text-decoration: none;
        color: var(--text);
        transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
        text-align: left;
        overflow: hidden;
        isolation: isolate;
      }

      /* Soft per-app accent glow that fades in on hover; not visible at rest. */
      .app-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          120% 80% at 0% 50%,
          var(--accent-glow, transparent) 0%,
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.2s ease;
        z-index: -1;
        pointer-events: none;
      }

      .app-card:hover::before,
      .app-card:focus-visible::before {
        opacity: 1;
      }

      .app-card:hover,
      .app-card:focus-visible {
        border-color: var(--accent, var(--hum));
        background: var(--card-hover);
        transform: translateY(-1px);
      }

      .app-card:focus-visible {
        outline: 2px solid var(--accent, var(--hum));
        outline-offset: 3px;
      }

      .app-card--hum { --accent: var(--hum); --accent-glow: rgba(255, 142, 155, 0.10); }
      .app-card--tir { --accent: var(--tir); --accent-glow: rgba(0, 229, 255, 0.08); }

      .app-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        flex-shrink: 0;
        display: block;
        object-fit: cover;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.04),
          0 6px 18px rgba(0, 0, 0, 0.35);
      }

      .app-info {
        flex: 1;
        min-width: 0;
      }

      .app-name {
        font-size: 1.05rem;
        font-weight: 400;
        letter-spacing: -0.015em;
        line-height: 1.2;
        color: var(--text);
      }

      .app-name .accent {
        color: var(--accent, var(--hum));
        font-weight: 300;
      }

      .app-desc {
        font-size: 0.82rem;
        font-weight: 300;
        color: var(--dim);
        margin-top: 0.2rem;
        line-height: 1.4;
        text-wrap: pretty;
      }

      .app-chevron {
        flex-shrink: 0;
        color: var(--dim);
        font-size: 1.1rem;
        line-height: 1;
        opacity: 0.5;
        transition: transform 0.2s ease, color 0.2s ease, opacity 0.2s ease;
      }

      .app-card:hover .app-chevron,
      .app-card:focus-visible .app-chevron {
        transform: translateX(2px);
        color: var(--accent, var(--hum));
        opacity: 1;
      }

      .meta-line {
        margin-top: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        font-size: 0.78rem;
        color: var(--dim);
        letter-spacing: 0.04em;
      }

      .meta-line .sep {
        opacity: 0.4;
      }

      .meta-line a {
        color: var(--muted);
        text-decoration: none;
        transition: color 0.15s ease;
      }

      .meta-line a:hover,
      .meta-line a:focus-visible {
        color: var(--text);
      }

      .meta-line a:focus-visible {
        outline: 2px solid var(--muted);
        outline-offset: 3px;
        border-radius: 2px;
      }

      .app-status {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 0.4rem;
        font-size: 0.72rem;
        font-weight: 300;
        color: var(--muted);
        letter-spacing: 0.005em;
        line-height: 1;
        white-space: nowrap;
      }

      .app-status-dot {
        flex-shrink: 0;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent, var(--hum));
      }

      .app-status--live .app-status-dot {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, var(--hum)) 18%, transparent);
      }

      .app-status--soon {
        color: var(--dim);
      }

      .app-status--soon .app-status-dot {
        background: transparent;
        box-shadow: inset 0 0 0 1.25px var(--dim);
      }

      /* Entrance — one shot, staggered. No idle loops. */
      @media (prefers-reduced-motion: no-preference) {
        .brand-wordmark { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) both; }
        .tagline        { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) 0.08s both; }
        .app-card:nth-child(1) { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) 0.18s both; }
        .app-card:nth-child(2) { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) 0.26s both; }
        .meta-line     { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) 0.40s both; }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Mobile polish — tighter card padding + main inset. */
      @media (max-width: 480px) {
        main {
          padding: 2rem 1.1rem;
          gap: 1.6rem;
        }
        .app-card {
          padding: 0.95rem 1rem;
          gap: 0.85rem;
        }
        .app-icon {
          width: 44px;
          height: 44px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="halo" aria-hidden="true"></div>

    <main>
      <h1 class="brand-wordmark">aaam<span class="dot">.</span>dev</h1>
      <p class="tagline">a small studio. <em>two apps.</em> one for two, one for the room.</p>

      <nav class="apps" aria-label="our apps">
        <a href="/hum/" class="app-card app-card--hum">
          <img class="app-icon" src="/hum/images/icon-1024.png" alt="" width="48" height="48" loading="eager" decoding="async" />
          <div class="app-info">
            <div class="app-name">hum <span class="accent">· for two</span></div>
            <div class="app-desc">a calm, private space for couples.</div>
            <div class="app-status app-status--live"><span class="app-status-dot" aria-hidden="true"></span>free on the App Store</div>
          </div>
          <span class="app-chevron" aria-hidden="true">→</span>
        </a>
        <a href="/tir/" class="app-card app-card--tir">
          <img class="app-icon" src="/tir/images/icon-1024.png" alt="" width="48" height="48" loading="eager" decoding="async" />
          <div class="app-info">
            <div class="app-name">tir <span class="accent">· word race</span></div>
            <div class="app-desc">race the room to the target word.</div>
            <div class="app-status app-status--live"><span class="app-status-dot" aria-hidden="true"></span>free on the App Store</div>
          </div>
          <span class="app-chevron" aria-hidden="true">→</span>
        </a>
      </nav>

      <p class="meta-line">
        <a href="mailto:support@aaam.dev">support@aaam.dev</a>
        <span class="sep" aria-hidden="true">·</span>
        <span>may 2026</span>
      </p>
    </main>
  </body>
</html>
